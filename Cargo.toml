[workspace]
resolver = "3"
members = [
    "crates/aum-contract",
    "crates/aum-domain",
    "crates/aum-db",
    "crates/aum-ingest",
    "crates/aum-pricing",
    "crates/aum-adapters",
    "crates/aum-engine",
    "crates/aum-tui",
    "xtask",
]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false

[workspace.dependencies]
# ── internal ─────────────────────────────────────────────────────────────────
aum-contract = { path = "crates/aum-contract" }
aum-domain = { path = "crates/aum-domain" }
aum-db = { path = "crates/aum-db" }
aum-ingest = { path = "crates/aum-ingest" }
aum-pricing = { path = "crates/aum-pricing" }
aum-adapters = { path = "crates/aum-adapters" }
aum-engine = { path = "crates/aum-engine" }
aum-tui = { path = "crates/aum-tui" }

# ── serialization & types ────────────────────────────────────────────────────
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.24.0", features = ["v4", "v7", "serde"] }
rust_decimal = { version = "1.42.1", features = ["serde-with-str"] }

# ── async ────────────────────────────────────────────────────────────────────
#
# No `net`, `process` or `signal`: nothing here opens a socket, launches a
# process or signals one.
#
# This is not a compile-time guarantee that the binary cannot reach the network,
# and it should not be described as one: `sqlx` enables `tokio/net` transitively
# for the database drivers it ships alongside SQLite. What is checkable is that
# the dependency graph contains no HTTP client and no TLS stack at all — see
# `docs/privacy.md`, which states the claim at exactly that strength.
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "io-std"] }

# ── storage ──────────────────────────────────────────────────────────────────
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "uuid", "migrate", "macros"] }

# ── system & io ──────────────────────────────────────────────────────────────
#
# `sysinfo` and `nix` were here to walk process trees and signal an agent's
# whole process group. Reading history needs neither, and a monitor that no
# longer enumerates every process on the machine should not link the library
# that can.
notify = "8.2.0"
memchr = "2.8.3"
dirs = "6.0.0"

# ── crypto ───────────────────────────────────────────────────────────────────
sha2 = "0.11.0"

# ── diagnostics ──────────────────────────────────────────────────────────────
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
thiserror = "2.0.20"
anyhow = "1.0.104"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
# NOTE: `clippy::arithmetic_side_effects` is deliberately NOT set workspace-wide — it
# fires on every benign `+` and would drown the signal. It is applied narrowly, with
# `#[deny(...)]`, to the provider-usage normalization in `aum-domain::token_usage`,
# which is the one place where an unchecked u64 subtraction would wrap to ~1.8e19
# in a release build and ship a plausible, enormous, wrong number.

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Overflow checks stay ON in release. This crate does arithmetic on provider-reported
# counters; a silent wrap would produce a plausible, enormous, wrong number.
overflow-checks = true
