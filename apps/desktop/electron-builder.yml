appId: eu.oxpoint.agent-usage-monitor
productName: Agent Usage Monitor
copyright: Private project

directories:
  output: ../../release
  buildResources: build

files:
  - out/**/*
  - package.json

# The Rust backend ships beside the app rather than inside the asar: it must be
# an executable file on disk for the app to spawn it.
extraResources:
  - from: ../../target/aarch64-apple-darwin/release/aum-sidecar
    to: sidecar/aum-sidecar

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # A nested binary under Resources is NOT signed automatically. Omitting it
  # here makes notarization fail late and confusingly, long after the build
  # appears to have succeeded.
  binaries:
    - Contents/Resources/sidecar/aum-sidecar
  # Unsigned local builds. Set a real identity to distribute.
  identity: null

linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Development

win:
  target:
    - target: nsis
      arch: [x64]
