# Builds a version after every merge to main.
#
# The contract: a push to main ends as a tagged, published release, and the
# Homebrew formula follows it. The version is whatever Cargo.toml says, and it
# has to be new. Main changes only through a pull request, so the bump travels
# in the pull request (`make bump`), and `ci` refuses one that forgot. A merge
# that still arrives with a released version fails here, out loud, rather than
# releasing nothing quietly. Re-running on the commit that is already the
# release is a no-op.
#
# The build itself is `build.yml`, the same one pull requests run, so a merge
# never builds anything for the first time. Nothing is tagged until every
# target has built and the native ones have passed their tests.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One release at a time, in order. A second merge waits for the first.
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Read the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      release: ${{ steps.read.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - name: Read Cargo.toml and make sure that version is not released yet
        id: read
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if ! git fetch --quiet --depth=1 origin "refs/tags/v$version:refs/tags/v$version" 2>/dev/null; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "v$version is new; releasing it from ${GITHUB_SHA::7}."
          elif [ "$(git rev-parse "v$version^{commit}")" = "$GITHUB_SHA" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Already released::v$version is this very commit. Nothing to build."
          else
            echo "::error title=Nothing to release::Cargo.toml still says $version, and v$version is already released from another commit. The version travels in the pull request: run 'make bump' and commit Cargo.toml and Cargo.lock."
            exit 1
          fi

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}

  release:
    name: Tag v${{ needs.version.outputs.version }} and publish
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum -- *.tar.gz | tee SHA256SUMS

      - name: Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "v$VERSION" --message "aum $VERSION"
          git push origin "v$VERSION"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" --verify-tag --latest --title "v$VERSION" --generate-notes dist/*

  homebrew:
    name: Bump the Homebrew formula
    needs: [version, release]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Say so when there is no token
        if: env.TAP_TOKEN == ''
        run: |
          echo "::notice title=Homebrew formula not bumped::No HOMEBREW_TAP_TOKEN secret. Add a fine-grained token with read and write on contents of 7samael7/homebrew-tap, or point url and sha256 in Formula/aum.rb at v$VERSION by hand."

      - uses: actions/checkout@v7
        if: env.TAP_TOKEN != ''
        with:
          repository: 7samael7/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Point the formula at the new source tarball
        if: env.TAP_TOKEN != ''
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          url="https://github.com/$REPOSITORY/archive/refs/tags/v$VERSION.tar.gz"
          sha=$(curl --silent --show-error --fail --location "$url" | sha256sum | cut -d' ' -f1)
          sed -i \
            -e "s|^  url \".*\"$|  url \"$url\"|" \
            -e "s|^  sha256 \".*\"$|  sha256 \"$sha\"|" \
            Formula/aum.rb
          if git diff --quiet; then
            echo "Formula already at v$VERSION."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --all --message "aum $VERSION"
          git push
