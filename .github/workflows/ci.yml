# Every pull request builds what a merge would ship: all four release targets,
# with formatting, clippy and the test suite on each one that can run its own
# binary. The binaries are attached to the run for a week, for trying out.
name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: pr-${{ github.event.pull_request.number }}
